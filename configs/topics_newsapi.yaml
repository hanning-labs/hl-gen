n: 1
output: out/topics
run_name: newsapi
score_threshold: 1
max_refinement_rounds: 10

# Ground generation only in NewsAPI.org articles (skip Currents).
sources:
  - newsapi

styles:
  - conversational
  - opinion
  - explainer, casual

perspectives:
  - third-person
  - first-person
  - second-person

tenses:
  - present
  - past
  - future

categories:
  - health
  - business
  - entertainment
  - general
  - science
  - sports
  - technology

client:
  backend: openai
  base_url: http://localhost:8000/v1
  model: AxionML/Qwen3.5-9B-NVFP4
  max_new_tokens: 72000
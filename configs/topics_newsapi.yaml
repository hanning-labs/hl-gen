n: 1
output: out/topics
run_name: newsapi
score_threshold: 7
max_refinement_rounds: 10
max_concurrent: 1

# Ground generation only in NewsAPI.org articles (skip Currents).
sources:
  - newsapi

styles:
  - conversational
  - opinion
  - explainer, casual

perspectives:
  - third-person
  - first-person
  - second-person

tenses:
  - present
  - past
  - future

categories:
  - health
  - business
  - entertainment
  - general
  - science
  - sports
  - technology

client:
  model: Qwen/Qwen3.5-9B 
  enable_thinking: true
  max_new_tokens: 81920
  max_batch_size: 1
  top_k: 20
  min_p: 0
  presence_penalty: 1.5
  repetition_penalty: 1.0
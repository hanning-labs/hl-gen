# English-topics run grounded only in NewsAPI.org articles.
# Run with:  python examples/run_topics_batch.py configs/runs/topics_newsapi.yaml
n: 1
output: out/topics
run_name: newsapi
score_threshold: 1
max_refinement_rounds: 10

api: newsapi          # → configs/api/newsapi.yaml
linguistics: topics   # → configs/linguistics/topics.yaml

client:
  backend: openai
  base_url: http://localhost:8000/v1
  model: AxionML/Qwen3.5-9B-NVFP4
  max_new_tokens: 72000

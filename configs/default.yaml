# Default batch synthesis configuration.
# Run with:  python examples/run_batch.py configs/default.yaml

n: 10
output: out/batch_samples_article_selector.jsonl
seed: 36

client:
    model: Qwen/Qwen2.5-7B-Instruct   # any HF model id
    device: cuda                        # null → auto (cuda/mps/cpu)
    dtype: bfloat16                         # auto | float16 | bfloat16
    max_new_tokens: 1024
    max_batch_size: 4                   # set >1 to enable batching (e.g. 4 or 8)
    batch_timeout_sec: 0.02             # seconds to wait for a batch to fill
    compile_model: true                 # torch.compile — first batch slow, all subsequent faster
score_threshold: 8.0
max_refinement_rounds: 3
# max_concurrent: 2   # omit to auto-detect from GPU VRAM (~1 per 8 GB)

cs_types: [intra_sentential, inter_sentential, tag]
cs_functions: [expressive, quotation, emphasis, clarification]
cs_ratio_min: 0.2
cs_ratio_max: 0.5

language_pairs:
  - [Cantonese, English]
  - [Spanish, English]
  - [Mandarin, English]

age_min: 18
age_max: 60
genders: [male, female, non-binary]

perspectives: [first-person, third-person]
tenses: [past, present, future]
conversation_types: [casual chat, formal discussion, debate, storytelling]

categories:
  - general
  - society
  - science_technology
  - politics_government
  - economy_business_finance
  - arts_culture_entertainment
  - lifestyle_leisure
  - human_interest
  - sport
  - crime_law_justice
  - education
  - environment
  - labour
  - health
  - automotive
  - real_estate

news_types: [news, articles, discussion]

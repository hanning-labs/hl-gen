n: 25
output: out/topics
run_name: default
score_threshold: 8
max_refinement_rounds: 3
max_concurrent: 1

styles:
  - conversational 
  - opinion
  - explainer, casual

perspectives:
  - third-person
  - first-person
  - second-person

tenses:
  - present
  - past
  - future

categories:
  - general
  - society
  - science_technology
  - politics_government
  - economy_business_finance
  - arts_culture_entertainment
  - lifestyle_leisure
  - human_interest
  - sport
  - crime_law_justice
  - education
  - environment
  - health

news_types:
  - articles
  - discussion

client:
  backend: openai
  base_url: http://localhost:8000/v1
  model: AxionML/Qwen3.5-9B-NVFP4
  max_new_tokens: 1024

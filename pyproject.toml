[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-switch-data-synthesis"
version = "0.1.0"
description = "LinguaMaster code-switching data synthesis framework (skeleton)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
local = ["transformers>=4.44,<5.0", "torch>=2.2", "accelerate>=0.30", "lm-format-enforcer>=0.10"]
tools = ["python-dotenv>=1.0", "requests>=2.32", "pyyaml>=6.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

# This directory is the import root: top-level modules plus subpackages, with no
# wrapping `code_switch` package. Modules import each other by their bare names
# (e.g. `from models import ...`, `from agents.base import ...`).
[tool.setuptools]
py-modules = ["batch", "config", "models", "orchestrator", "principles", "prompting"]
packages = ["agents", "llm", "tools", "storage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Put the project root on sys.path so tests can import the bare top-level modules.
pythonpath = ["."]

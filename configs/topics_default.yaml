n: 10
output: out/topics_samples.jsonl
score_threshold: 8.0
max_refinement_rounds: 3

styles:
  - conversational 
  - opinion
  - explainer, casual
  - explainer, formal

perspectives:
  - third-person
  - first-person
  - second-person

tenses:
  - present
  - past
  - future

categories:
  - general
  - society
  - science_technology
  - politics_government
  - economy_business_finance
  - arts_culture_entertainment
  - lifestyle_leisure
  - human_interest
  - sport
  - crime_law_justice
  - education
  - environment
  - health

news_types:
  - news
  - articles
  - discussion

client:
  model: Qwen/Qwen2.5-7B-Instruct
  max_new_tokens: 1024
  max_batch_size: 1

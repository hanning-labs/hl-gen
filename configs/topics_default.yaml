n: 25
output: out/topics
run_name: default
score_threshold: 8
max_refinement_rounds: 3
max_concurrent: 1

styles:
  - conversational 
  - opinion
  - explainer, casual

perspectives:
  - third-person
  - first-person
  - second-person

tenses:
  - present
  - past
  - future

categories:
  - general
  - society
  - science_technology
  - politics_government
  - economy_business_finance
  - arts_culture_entertainment
  - lifestyle_leisure
  - human_interest
  - sport
  - crime_law_justice
  - education
  - environment
  - health

news_types:
  - articles
  - discussion

client:
  model: Qwen/Qwen2.5-7B-Instruct 
  max_new_tokens: 1024
  max_batch_size: 1

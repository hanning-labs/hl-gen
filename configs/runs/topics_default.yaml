# Default English-topics synthesis run.
# Run with:  python examples/run_topics_batch.py configs/runs/topics_default.yaml
n: 25
output: out/topics
run_name: default
score_threshold: 8
max_refinement_rounds: 3
max_concurrent: 1

client: local_vllm    # → configs/client/local_vllm.yaml
linguistics: topics   # → configs/linguistics/topics.yaml

# Inline api block: trimmed Currents-style taxonomy, no plain "news" type.
api:
  sources: [currents, newsapi]
  max_articles: 10
  news_types: [articles, discussion]
  categories:
    - general
    - society
    - science_technology
    - politics_government
    - economy_business_finance
    - arts_culture_entertainment
    - lifestyle_leisure
    - human_interest
    - sport
    - crime_law_justice
    - education
    - environment
    - health

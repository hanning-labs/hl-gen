[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-switch-data-synthesis"
version = "0.1.0"
description = "LinguaMaster code-switching data synthesis framework (skeleton)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
local = ["transformers>=4.44", "torch>=2.2", "accelerate>=0.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

# This directory IS the `code_switch` package.
[tool.setuptools]
packages = [
    "code_switch",
    "code_switch.llm",
    "code_switch.agents",
    "code_switch.tools",
    "code_switch.storage",
]

[tool.setuptools.package-dir]
"code_switch" = "."

[tool.pytest.ini_options]
asyncio_mode = "auto"
